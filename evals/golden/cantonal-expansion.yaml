  - id: g-cant2-ai-dog-tax
    question: Wie hoch ist die Hundesteuer in Appenzell Innerrhoden?
    locations: [Appenzell Innerrhoden]
    language: de
    area: taxes
    level: cantonal
    split: dev
    note: >-
      Verified in corpus (the passage sits on the ar.ch dog-tax page, tagged CH-AR): ar.ch/verwaltung/.../hunde/hundesteuer,
      "Die Hundesteuern betragen Fr. 80.- pro Hund (landwirtschaftliche Hofhunde Fr. 50.-), und für jeden
      weiteren Hund desselben Halters Fr. 160.-. In Appenzell Innerrhoden werden die Hundesteuern durch die
      Bezirksverwaltungen erhoben." A correct answer must not give the AR rate (Fr. 120). Watch for the AI
      probe being answered from an AR-tagged page or returning no_evidence because of the extent tag.
    expect: {status: results, sources: [hunde/hundesteuer], key_fact: "In Appenzell Innerrhoden the dog tax is CHF 80 per dog (farm dogs CHF 50, each further dog CHF 160), collected by the district administrations."}
