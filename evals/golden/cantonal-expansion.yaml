probes:
  - id: g-cant2-ag-dog-tax
    question: Wie hoch ist die Hundetaxe im Kanton Aargau?
    locations: [Kanton Aargau]
    language: de
    area: taxes
    level: cantonal
    split: dev
    note: >-
      Dog tax mapped to area taxes (no dogs area). Verified in corpus: ag.ch/de/themen/landwirtschaft-tiere/
      heim-und-nutztiere/hunde, "Die Hundetaxe beträgt jährlich 120 Franken für jeden Hund. Davon gehen 20
      Franken an den Kanton, über den Rest können die Gemeinden verfügen."
    expect: {status: results, sources: [heim-und-nutztiere/hunde], key_fact: "The Aargau dog tax is CHF 120 per dog per year, of which CHF 20 goes to the canton and the rest to the municipality."}
  - id: g-cant2-lu-foreign-licence
    question: How long can I drive with my foreign driving licence after moving to the canton of Lucerne?
    locations: [Luzern]
    language: en
    area: driving
    level: cantonal
    split: holdout
    note: >-
      Verified in corpus: strassenverkehrsamt.lu.ch/.../spezielle_fuehrerausweise/auslaendischer_fuehrerausweis,
      "Motorfahrzeugführer/innen aus dem Ausland dürfen in der Schweiz während 12 Monaten seit Einreisedatum
      Motorfahrzeuge führen, wenn sie einen gültigen nationalen Führerausweis besitzen." The rule is federal,
      but the Luzern page is the expected cantonal citation.
    expect: {status: results, sources: [auslaendischer_fuehrerausweis], key_fact: "A valid foreign licence may be used for 12 months from the date of entry; after that it must be exchanged."}
