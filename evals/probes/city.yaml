tier: city
probes:
  - id: city-001
    question: When is the next cardboard collection?
    location: "8003"
    categories: [waste]
    kind: structural
    failure_class: temporal_misapplication
    status: red
    judge: true
    note: With a frozen clock of 2026-09-16 the nearest future event is 2026-09-17. Today the reranker only penalises past events, so ordering among future events is arbitrary and the first page can start in December.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      must_include:
        - {source: open_erz, url_contains: "#cardboard-2026-09-17"}
      first_event: nearest_future

  - id: city-002
    question: When is the next cardboard collection?
    location: "8004"
    categories: [waste]
    kind: structural
    failure_class: silent_under_coverage
    status: red
    judge: true
    note: Only 8003 has calendar data. Kreis 4 must get city and canton guidance, no Kreis 3 dates, and a coverage signal saying Kreis 4 itself is empty. The signal does not exist yet.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K4}
      must_exclude:
        - {source: open_erz}
        - {extent: off_path}
      must_include:
        - {source: stadt_zuerich, url_contains: karton}
      coverage_empty: [CH-ZH-261-K4]
      coverage_present: [CH-ZH-261]

  - id: city-003
    question: Did I miss last week's cardboard collection?
    location: "8003"
    categories: [waste]
    kind: structural
    failure_class: temporal_misapplication
    status: green
    note: Past events must stay reachable, just not first.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      must_include:
        - {source: open_erz, url_contains: "#cardboard-2026-09-10"}

  - id: city-004
    question: When is paper collected?
    location: "8003"
    categories: [waste]
    kind: ranking
    failure_class: entity_substitution
    status: red
    judge: true
    note: Paper and cardboard are different collections. The first citation must be a paper event, not cardboard. Ranking probe, live database only.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      first_url_contains: "#paper-"
      first_event: nearest_future

  - id: city-005
    question: Where can my dog run off leash?
    location: Wiedikon
    categories: [dogs]
    kind: structural
    failure_class: jurisdiction_confusion
    status: green
    note: Control probe. Quartier alias resolves, Kreis 3 document ranks first, nothing off the path.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3-ALT-WIEDIKON}
      first_extent: CH-ZH-261-K3
      must_exclude:
        - {extent: off_path}
        - {extent: CH-BS}

  - id: city-006
    question: Where can my dog run off leash?
    location: Seefeld
    categories: [dogs]
    kind: structural
    failure_class: jurisdiction_confusion
    status: red
    judge: true
    note: Seefeld is Kreis 8. The Wiedikon dog zone is a sibling and must not appear. Coverage must say Kreis 8 is empty; the signal does not exist yet.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K8-SEEFELD}
      must_exclude:
        - {extent: CH-ZH-261-K3}
        - {extent: off_path}
      must_include:
        - {source: stadt_zuerich, url_contains: parks/hunde}
      coverage_empty: [CH-ZH-261-K8-SEEFELD, CH-ZH-261-K8]

  - id: city-007
    question: Do I need to leash my dog in the forest in July?
    location: Zürich
    categories: [dogs]
    kind: structural
    failure_class: authority_hierarchy
    status: green
    judge: true
    note: The canton rule is the operative one. Institutional advice from Schweizer Wanderwege at country level must not appear ahead of it.
    expect:
      status: results
      resolved: {id: CH-ZH-261}
      alternatives_include: [CH-ZH]
      must_include:
        - {source: zh_ch, url_contains: hunde}
      must_exclude:
        - {authority: institutional, extent: CH}

  - id: city-008
    question: How much is the dog tax?
    location: Stadt Zürich
    categories: [dogs]
    kind: structural
    failure_class: silent_under_coverage
    status: red
    judge: true
    note: No indexed page states the city dog tax. The result may carry ch.ch and canton evidence but must carry a coverage signal. City-level dog documents exist, so coverage_present holds; the failure is the missing signal.
    expect:
      status: results
      resolved: {id: CH-ZH-261}
      must_include:
        - {source: ch_ch, url_contains: dogs}
      coverage_present: [CH-ZH-261, CH]

  - id: city-009
    question: When is cardboard collected?
    location: Kreis 3
    categories: [waste]
    kind: structural
    failure_class: none
    status: green
    note: Control probe for the Kreis alias.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      method: alias
      must_include:
        - {source: open_erz}

  - id: city-010
    question: When is cardboard collected in Kreis 3?
    categories: [waste]
    kind: structural
    failure_class: none
    status: green
    note: Location given only inside the question; the scanner must find it.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      method: alias_in_question
      must_include:
        - {source: open_erz}

  - id: city-011
    question: When is cardboard collected?
    location: "8045"
    categories: [waste]
    kind: structural
    failure_class: none
    status: green
    note: 8045 is a second postal code inside Kreis 3; the 8003 calendar applies because the calendar is filed at Kreis level.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      must_include:
        - {source: open_erz}

  - id: city-012
    question: Where can my dog run off leash?
    location: City
    categories: [dogs]
    kind: structural
    failure_class: entity_substitution
    status: red
    note: '"City" is a Quartier name in Kreis 1. A bare "City" as a location must not resolve to that Quartier; it is ambiguous and should need a location. Today it resolves to CH-ZH-261-K1-CITY.'
    expect:
      status: needs_location

  - id: city-013
    question: Where can my dog run off leash?
    location: Zurich City
    categories: [dogs]
    kind: structural
    failure_class: entity_substitution
    status: green
    note: Control probe. The "Zurich city" alias belongs to the municipality.
    expect:
      status: results
      resolved: {id: CH-ZH-261}

  - id: city-014
    question: Where can my dog run off leash in Hard?
    categories: [dogs]
    kind: structural
    failure_class: entity_substitution
    status: green
    note: Hard is a Quartier in Kreis 4 and also a common English word. Without a marker the scanner must not resolve it; with no other location the response is needs_location. Passes today because the scanner already rejects bare common-word unigrams.
    expect:
      status: needs_location

  - id: city-015
    question: Where can my dog run off leash?
    location: Quartier Hard
    categories: [dogs]
    kind: structural
    failure_class: none
    status: red
    note: Marked Quartier input. The alias index has "Hard" but not "Quartier Hard", so the exact lookup fails and the scanner or GeoAdmin decides. Expected is the Quartier node.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K4-HARD}

  - id: city-016
    question: What are the rules for dogs?
    location: Zürich West
    categories: [dogs]
    kind: structural
    failure_class: none
    status: green
    note: Alias of the Escher Wyss Quartier.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K5-ESCHER-WYSS}
      must_exclude:
        - {extent: off_path}

  - id: city-017
    question: Which cantonal rules apply to dogs on hiking trails?
    location: Kanton Zürich
    categories: [dogs, hiking]
    kind: structural
    failure_class: jurisdiction_confusion
    status: green
    note: Marked canton input must resolve to the canton, not the city, and must not return city documents.
    expect:
      status: results
      resolved: {id: CH-ZH}
      must_include:
        - {source: zh_ch, extent: CH-ZH}
      must_exclude:
        - {extent: CH-ZH-261}
        - {extent: off_path}

  - id: city-018
    question: When is cardboard collected?
    location: "8003"
    categories: [waste]
    as_of: "2026-09-12"
    kind: structural
    failure_class: temporal_misapplication
    status: red
    note: With as_of 2026-09-12, the nearest event at or after that date is 2026-09-17, so it must be first. The runner evaluates nearest_future against as_of when a probe sets one. Today as_of only filters law validity and does not order calendar evidence.
    expect:
      status: results
      resolved: {id: CH-ZH-261-K3}
      first_url_contains: "#cardboard-2026-09-17"
      first_event: nearest_future

  - id: city-019
    question: Was ist die Leinenpflicht im Wald?
    location: Zürich
    categories: [dogs]
    kind: structural
    failure_class: none
    status: green
    note: German question over English-indexed text. The lexical leg misses; the dense leg must carry it on the live corpus. On fixtures with the fake embedder this checks only routing.
    expect:
      status: results
      resolved: {id: CH-ZH-261}

  - id: city-020
    question: Who maintains hiking trail signposts?
    location: Zürich
    categories: [hiking]
    kind: ranking
    failure_class: authority_hierarchy
    status: red
    judge: true
    note: Federal law assigns trails to cantons. On the live corpus the institutional Schweizer Wanderwege pages dominate hiking; the federal act must still be in the results. Ranking probe, live database only.
    expect:
      status: results
      resolved: {id: CH-ZH-261}
      must_include:
        - {source: fedlex, url_contains: "1991/1052"}
