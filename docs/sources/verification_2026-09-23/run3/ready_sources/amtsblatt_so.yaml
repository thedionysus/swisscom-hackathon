# Gazette source generated 2026-09-23 from the Amtsblattportal rubric list (own rubrics of the canton only).
# 14-day volume at generation: 354 notices (one page holds up to 2,000).
# Limits: titles and metadata only (the list endpoint has no notice text); event_date is not set
# (the api fetcher reads only top-level fields); the document URL is the API feed, not a public notice page.
id: amtsblatt_so
name: Amtsblatt Solothurn (Amtsblattportal API)
base_url: https://amtsblattportal.ch
default_extent_id: CH-SO
authority: official_info
categories: []
fetch_strategy: api
fetch_config:
  url: https://amtsblattportal.ch/api/v1/publications?publicationStates=PUBLISHED&tenant=kabso&rubrics=AL-SO,AR-SO,BA-SO,BU-SO,GE-SO,RE-SO,VA-SO&publicationDate.start={start}&pageRequest.page=0&pageRequest.size=2000
  start_offset_days: 14
  records_path: content
  id_template: '{meta[id]}'
  title_template: '{meta[title][de]}'
  text_template: '{meta[title][de]}. Amtsblatt Solothurn, rubric {meta[rubric]}, publication {meta[publicationNumber]}, {meta[publicationDate]}.'
  language: de
allow_narrowing: true
llm_tagging: true
license: 'Amtsblattportal (SECO) documented API; robots.txt Disallow: / (user decision 2026-09-23: use the API)'
