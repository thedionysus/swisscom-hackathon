  <line x1="864" y1="670" x2="892" y2="670" stroke="#d52b1e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <text x="900" y="674" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROPOSED READ PATH</text>
</svg>
