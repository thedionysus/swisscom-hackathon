  <rect x="380" y="664" width="20" height="12" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <text x="408" y="674" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNAL SERVICE</text>
  <rect x="540" y="664" width="20" height="12" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="568" y="674" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROPOSED, NOT BUILT</text>
  <line x1="724" y1="670" x2="752" y2="670" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
