<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jev-architecture-title jev-architecture-desc">
  <title id="jev-architecture-title">Jev integration architecture</title>
  <desc id="jev-architecture-desc">Architecture showing an offline Jev runner that reads corpus passages and eval claims, calls TypeSafe's Jev model through Vercel's AI Gateway, and writes verdicts that swiss_search could read later, while query-time search stays keyless.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d52b1e"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zones -->
  <rect x="40" y="56" width="768" height="360" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="52" y="60" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="56" y="68" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OFFLINE · CORPUS AND EVALS</text>

  <rect x="840" y="56" width="400" height="360" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="852" y="60" width="92" height="12" rx="2" fill="#f5f5f5"/>
  <text x="856" y="68" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EXTERNAL · HTTPS</text>

  <rect x="40" y="456" width="1200" height="168" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="52" y="460" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="56" y="468" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">QUERY TIME · UNCHANGED, NO KEY</text>

  <!-- Arrows (before nodes) -->
  <line x1="280" y1="136" x2="360" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="296" y="116" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="320" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASSAGES</text>

  <line x1="280" y1="320" x2="360" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="300" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="320" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIMS</text>

  <line x1="568" y1="128" x2="880" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="684" y="108" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="728" y="117" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">30 PER REQUEST</text>

  <line x1="880" y1="168" x2="568" y2="168" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="700" y="148" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="728" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICTS</text>

  <line x1="1040" y1="192" x2="1040" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="1048" y="228" width="84" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1090" y="237" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TYPESAFE FIRST</text>

  <line x1="568" y1="320" x2="624" y2="320" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="580" y="300" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="596" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

  <path d="M 704,360 V 544 Q 704,552 696,552 H 600" fill="none" stroke="#d52b1e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
  <rect x="712" y="428" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="740" y="437" fill="#d52b1e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ FLAG</text>

  <line x1="280" y1="552" x2="360" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="296" y="532" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="320" y="541" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUESTION</text>

  <!-- Nodes -->
  <!-- Corpus (store) -->
  <rect x="80" y="96" width="200" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="96" width="200" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="88" y="102" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="102" y="111" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
  <text x="180" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Corpus</text>
  <text x="180" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">237,339 live chunks</text>

  <!-- Eval answers (store) -->
  <rect x="80" y="280" width="200" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="280" width="200" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="88" y="286" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="106" y="295" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>
  <text x="180" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Eval answers</text>
  <text x="180" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">evals/judge/*.jsonl</text>

  <!-- Jev runner (focal) -->
  <rect x="360" y="96" width="208" height="264" rx="6" fill="#f5f5f5"/>
  <rect x="360" y="96" width="208" height="264" rx="6" fill="#d52b1e" fill-opacity="0.08" stroke="#d52b1e" stroke-width="1"/>
  <rect x="368" y="102" width="28" height="12" rx="2" fill="none" stroke="#d52b1e" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="382" y="111" fill="#d52b1e" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
  <text x="464" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jev runner</text>
  <text x="464" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">offline · research script</text>
  <line x1="376" y1="168" x2="552" y2="168" stroke="#d52b1e" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="380" y="188" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TESTED ON</text>
  <text x="380" y="212" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Chunk cleaning</text>
  <text x="380" y="236" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Data cleaning · dates</text>
  <text x="380" y="260" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Categorization · topics</text>
  <text x="380" y="284" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Place logic</text>
  <text x="380" y="308" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Answer checking</text>

  <!-- Stored verdicts (proposed) -->
  <rect x="624" y="280" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="624" y="280" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="632" y="286" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="658" y="295" fill="#2d3142" fill-opacity="0.6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROPOSED</text>
  <text x="704" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stored verdicts</text>
  <text x="704" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flag · score · date</text>

  <!-- Vercel AI Gateway (external) -->
  <rect x="880" y="96" width="320" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="880" y="96" width="320" height="96" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="888" y="102" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="902" y="111" fill="#2d3142" fill-opacity="0.6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="1040" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel AI Gateway</text>
  <text x="1040" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/typesafe/v1/systemone</text>

  <!-- TypeSafe Jev (external) -->
  <rect x="880" y="280" width="320" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="880" y="280" width="320" height="80" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="888" y="286" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="908" y="295" fill="#2d3142" fill-opacity="0.6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
  <text x="1040" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TypeSafe · Jev</text>
  <text x="1040" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typesafe-ai/jev · shared capacity</text>

  <!-- MCP client (input) -->
  <rect x="80" y="512" width="200" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="512" width="200" height="80" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
  <rect x="88" y="518" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="104" y="527" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="180" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP client</text>
  <text x="180" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude, other clients</text>

  <!-- swiss_search (backend) -->
  <rect x="360" y="512" width="240" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="360" y="512" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="368" y="518" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="384" y="527" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="480" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">swiss_search</text>
  <text x="480" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">place logic → status</text>

  <!-- Editorial asides -->
  <text x="880" y="388" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Limit: shared capacity, about 17,000</text>
  <text x="880" y="404" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">passages an hour in the one-hour run.</text>
  <text x="784" y="548" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Search stays keyless: Jev never runs at</text>
  <text x="784" y="564" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">query time, it only writes verdicts.</text>

  <!-- Legend -->
  <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
