<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source approval path</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Swiss Grounding MCP</p>
    <h1>Who gets to add a source</h1>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-approval-title sg-approval-desc">
      <title id="sg-approval-title">Source approval path</title>
      <desc id="sg-approval-desc">Flowchart showing a client-proposed source being validated, rejected if already known, auto-approved when it sits on an official Swiss government domain, and otherwise queued as pending for a maintainer to approve or reject.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors (before nodes) -->
      <line x1="380" y1="76" x2="380" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="168" x2="380" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 292,232 H 128 Q 120,232 120,240 V 598" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="276" x2="380" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="468" y1="372" x2="608" y2="372" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="416" x2="380" y2="474" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="398" x2="700" y2="598" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="380" y1="526" x2="380" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="468" y1="620" x2="616" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="292" y1="620" x2="204" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Branch labels -->
      <rect x="188" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="388" y="294" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="516" y="352" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="361" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="388" y="436" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="512" y="600" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="544" y="609" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

      <rect x="220" y="600" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="609" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REJECT</text>

      <!-- Start (oval) -->
      <rect x="296" y="32" width="168" height="44" rx="20" fill="#f5f5f5"/>
      <rect x="296" y="32" width="168" height="44" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="380" y="50" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client proposes</text>
      <text x="380" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">swiss_suggest_source</text>

      <!-- Step: validate -->
      <rect x="288" y="116" width="184" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="116" width="184" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate</text>
      <text x="380" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">url shape · HTTP &lt; 400</text>

      <!-- Decision: already known -->
      <polygon points="380,188 468,232 380,276 292,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">already a source?</text>

      <!-- Decision: official domain -->
      <polygon points="380,328 468,372 380,416 292,372" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">official domain?</text>
      <text x="380" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.admin.ch · canton · city</text>

      <!-- Step: auto-approve (focal) -->
      <rect x="608" y="346" width="184" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="346" width="184" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="700" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auto-approve</text>
      <text x="700" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">official_info · auto extent</text>

      <!-- Step: pending -->
      <rect x="288" y="474" width="184" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="474" width="184" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Queue as pending</text>
      <text x="380" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sources review</text>

      <!-- Decision: maintainer -->
      <polygon points="380,576 468,620 380,664 292,620" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="624" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">maintainer decides</text>

      <!-- End: source active -->
      <rect x="616" y="598" width="168" height="44" rx="20" fill="#f5f5f5"/>
      <rect x="616" y="598" width="168" height="44" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="700" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source active</text>
      <text x="700" y="630" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingested next run</text>

      <!-- End: rejected -->
      <rect x="36" y="598" width="168" height="44" rx="20" fill="#f5f5f5"/>
      <rect x="36" y="598" width="168" height="44" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="120" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rejected</text>
      <text x="120" y="630" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">note recorded</text>

      <!-- Legend -->
      <line x1="32" y1="708" x2="968" y2="708" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="128" y="716" width="20" height="12" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="156" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">START / END</text>

      <rect x="320" y="716" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="348" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STEP</text>

      <polygon points="500,714 512,722 500,730 488,722" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DECISION</text>

      <rect x="680" y="716" width="20" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="708" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO HUMAN GATE</text>
    </svg>
  </div>
</body>
</html>
