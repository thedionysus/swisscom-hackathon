<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>swiss_search — one grounded answer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Swiss Grounding MCP</p>
    <h1>swiss_search — from question to cited chunks</h1>

    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-sequence-title sg-sequence-desc">
      <title id="sg-sequence-title">swiss_search — one grounded answer</title>
      <desc id="sg-sequence-desc">Sequence diagram of an MCP search call: the query core resolves a jurisdiction, embeds the question, runs dense and lexical retrieval against PostgreSQL, then reranks and returns citations — or asks the caller for a location when none can be resolved.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="100" y1="80" x2="100" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="80" x2="320" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="80" x2="520" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="80" x2="700" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="80" x2="880" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ALT fragment frame -->
      <rect x="88" y="176" width="804" height="372" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="88" y="176" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="108" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="112" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[location resolved]</text>
      <line x1="96" y1="444" x2="884" y2="444" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="112" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · location unresolved]</text>

      <!-- Activation bars -->
      <rect x="316" y="120" width="8" height="428" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="516" y="152" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="516" y="464" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="696" y="256" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="876" y="312" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="100" y1="120" x2="316" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="324" y1="152" x2="516" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="516" y1="228" x2="324" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="324" y1="256" x2="696" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="696" y1="284" x2="324" y2="284" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="324" y1="312" x2="876" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="876" y1="340" x2="324" y2="340" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 324,368 H 360 Q 368,368 368,376 V 384 Q 368,392 360,392 H 324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="316" y1="416" x2="100" y2="416" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="516" y1="492" x2="324" y2="492" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="316" y1="520" x2="100" y2="520" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Message labels -->
      <rect x="172" y="100" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SWISS_SEARCH</text>

      <rect x="384" y="132" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESOLVE LOC</text>

      <rect x="384" y="208" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTENT PATH</text>

      <rect x="568" y="236" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EMBED QUESTION</text>

      <rect x="588" y="264" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="273" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VECTOR</text>

      <rect x="748" y="292" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="790" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DENSE+LEXICAL</text>

      <rect x="752" y="320" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="790" y="329" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOP 50 CAND.</text>

      <rect x="380" y="374" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="414" y="383" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RANK+RECENCY</text>

      <rect x="180" y="396" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="405" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CITATIONS</text>

      <rect x="392" y="472" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="481" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO MATCH</text>

      <rect x="168" y="500" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="509" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEEDS_LOCATION</text>

      <!-- Actors -->
      <rect x="32" y="32" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="32" width="136" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="100" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP Client</text>
      <text x="100" y="70" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent</text>

      <rect x="252" y="32" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="252" y="32" width="136" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="320" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QueryCore</text>
      <text x="320" y="70" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">query_core.py</text>

      <rect x="452" y="32" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="452" y="32" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolver</text>
      <text x="520" y="70" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alias · question scan</text>

      <rect x="632" y="32" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="32" width="136" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="700" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedder</text>
      <text x="700" y="70" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pluggable</text>

      <rect x="812" y="32" width="136" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="812" y="32" width="136" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="880" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="880" y="70" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pgvector + tsv</text>

      <!-- Legend -->
      <line x1="32" y1="608" x2="968" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="624" x2="148" y2="624" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="156" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MCP TOOL CALL</text>

      <line x1="320" y1="624" x2="348" y2="624" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="356" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL</text>

      <line x1="480" y1="624" x2="508" y2="624" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="516" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>

      <line x1="656" y1="624" x2="684" y2="624" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="692" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HEADLINE SUCCESS</text>
    </svg>
  </div>
</body>
</html>
