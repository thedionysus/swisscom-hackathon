<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document version lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Swiss Grounding MCP</p>
    <h1>What a re-ingest does to a document version</h1>

    <svg viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-lifecycle-title sg-lifecycle-desc">
      <title id="sg-lifecycle-title">Document version lifecycle</title>
      <desc id="sg-lifecycle-desc">State machine showing a document version staying current while its content hash is unchanged, becoming superseded when a new version is inserted, or becoming withdrawn when the page disappears from the source — with rows retained in both terminal states.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Transitions (before states) -->
      <line x1="62" y1="208" x2="144" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 196,176 C 196,124 260,124 260,176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 312,192 H 528 Q 536,192 536,184 V 144" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 312,224 H 552 Q 560,224 560,232 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="76" y="188" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">insert v1</text>

      <rect x="164" y="100" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="228" y="109" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">unchanged [hash match]</text>

      <rect x="376" y="172" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="181" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">content changed</text>

      <rect x="372" y="204" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">gone from source</text>

      <!-- Start marker -->
      <circle cx="56" cy="208" r="6" fill="#2d3142"/>

      <!-- State: current -->
      <rect x="144" y="176" width="168" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="144" y="176" width="168" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="228" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">current</text>
      <text x="228" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the version served</text>

      <!-- State: superseded (focal) -->
      <rect x="472" y="80" width="168" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="472" y="80" width="168" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="556" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">superseded</text>
      <text x="556" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">superseded_by → new id</text>

      <!-- State: withdrawn -->
      <rect x="472" y="304" width="168" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="472" y="304" width="168" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="556" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">withdrawn</text>
      <text x="556" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">url no longer published</text>

      <!-- Editorial callout -->
      <text x="960" y="48" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">neither terminal state deletes the row</text>
      <path d="M 872,56 Q 780,72 652,110" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="652" cy="110" r="2" fill="#eb6c36"/>

      <!-- Legend -->
      <line x1="32" y1="436" x2="968" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="128" cy="450" r="5" fill="#2d3142"/>
      <text x="144" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">START</text>

      <rect x="272" y="444" width="16" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LIVE STATE</text>

      <rect x="480" y="444" width="16" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="504" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TERMINAL · VERSIONED</text>

      <rect x="760" y="444" width="16" height="12" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="784" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TERMINAL · DELISTED</text>
    </svg>
  </div>
</body>
</html>
