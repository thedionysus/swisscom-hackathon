<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jev-deployment-title jev-deployment-desc">
  <title id="jev-deployment-title">Where the Jev run executes</title>
  <desc id="jev-deployment-desc">Deployment showing a laptop running the Jev runner, Postgres in Docker and the result files, calling Vercel's AI Gateway over HTTPS, which routes to typesafe-ai first and to a digitalocean fallback that returned 503.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d52b1e"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Zones: real boundaries (local machine, Vercel, third-party model hosts) -->
  <rect x="40" y="56" width="480" height="560" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="52" y="48" width="148" height="16" rx="2" fill="#f5f5f5"/>
  <text x="56" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAPTOP · MACOS</text>

  <rect x="560" y="56" width="280" height="560" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="572" y="48" width="152" height="16" rx="2" fill="#f5f5f5"/>
  <text x="576" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERCEL · AI GATEWAY</text>

  <rect x="880" y="56" width="360" height="560" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="892" y="48" width="132" height="16" rx="2" fill="#f5f5f5"/>
  <text x="896" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MODEL PROVIDERS</text>

  <!-- Network paths (before nodes) -->
  <line x1="172" y1="288" x2="172" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="180" y="328" width="76" height="12" rx="2" fill="#f5f5f5"/>
  <text x="218" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL READ-ONLY</text>

  <line x1="388" y1="288" x2="388" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="396" y="328" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="418" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPEND</text>

  <line x1="480" y1="176" x2="592" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="508" y="156" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="536" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

  <line x1="808" y1="176" x2="912" y2="176" stroke="#d52b1e" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="828" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="860" y="165" fill="#d52b1e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1ST CHOICE</text>

  <path d="M 700,288 V 464 Q 700,472 708,472 H 912" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <rect x="708" y="372" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="736" y="381" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FALLBACK</text>

  <!-- Nodes -->
  <!-- Jev runner -->
  <rect x="80" y="112" width="400" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="112" width="400" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="88" y="118" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="104" y="127" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
  <rect x="440" y="118" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="456" y="127" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">x4</text>
  <text x="280" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jev runner</text>
  <text x="280" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 questions × 2 requests in flight</text>
  <rect x="96" y="192" width="368" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="108" y="208" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">run_parallel.py</text>
  <text x="452" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">python 3.12</text>
  <rect x="96" y="232" width="368" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="108" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">httpx client</text>
  <text x="452" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">retry-after · 8 tries</text>

  <!-- Postgres in Docker -->
  <rect x="80" y="384" width="184" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="80" y="384" width="184" height="176" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="88" y="390" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="110" y="399" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOCKER</text>
  <text x="172" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
  <text x="172" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost:5433</text>
  <rect x="92" y="464" width="160" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="100" y="480" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">swiss_grounding</text>
  <text x="244" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">pg 16</text>

  <!-- Result files -->
  <rect x="296" y="384" width="184" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="296" y="384" width="184" height="176" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="304" y="390" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="322" y="399" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>
  <text x="388" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Result files</text>
  <text x="388" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSONL, append only</text>
  <rect x="308" y="464" width="160" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="316" y="480" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">raw_*.jsonl</text>
  <text x="460" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">resumable</text>

  <!-- AI Gateway -->
  <rect x="592" y="112" width="216" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="592" y="112" width="216" height="176" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="600" y="118" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="624" y="127" fill="#2d3142" fill-opacity="0.6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
  <text x="700" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Gateway</text>
  <text x="700" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ai-gateway.vercel.sh</text>
  <rect x="604" y="192" width="192" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="612" y="208" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">systemone API</text>
  <text x="788" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v1</text>
  <rect x="604" y="232" width="192" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="612" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">provider order</text>
  <text x="788" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">typesafe 1st</text>

  <!-- typesafe-ai (focal: the capacity limit) -->
  <rect x="912" y="112" width="296" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="912" y="112" width="296" height="176" rx="6" fill="#d52b1e" fill-opacity="0.08" stroke="#d52b1e" stroke-width="1"/>
  <rect x="920" y="118" width="48" height="12" rx="2" fill="none" stroke="#d52b1e" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="944" y="127" fill="#d52b1e" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
  <text x="1060" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">typesafe-ai</text>
  <text x="1060" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">served every answer seen</text>
  <rect x="924" y="192" width="272" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="932" y="208" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">jev</text>
  <text x="1188" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">unpinned</text>

  <!-- digitalocean (fallback, failing) -->
  <rect x="912" y="384" width="296" height="176" rx="6" fill="#f5f5f5"/>
  <rect x="912" y="384" width="296" height="176" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="920" y="390" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
  <text x="944" y="399" fill="#2d3142" fill-opacity="0.6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANAGED</text>
  <text x="1060" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">digitalocean</text>
  <text x="1060" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fallback route · 503</text>
  <rect x="924" y="496" width="272" height="24" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="932" y="512" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">jev</text>
  <text x="1188" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">unpinned</text>

  <!-- Editorial asides -->
  <text x="80" y="588" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">One hour: 17,400 passages, 30 per request, $0 billed.</text>
  <text x="912" y="588" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The limit is capacity: 692 × 503 and</text>
  <text x="912" y="604" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">93 × 429 in the same hour.</text>

  <!-- Legend -->
  <line x1="40" y1="644" x2="1240" y2="644" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="660" width="20" height="12" rx="2" fill="#d52b1e" fill-opacity="0.08" stroke="#d52b1e" stroke-width="1"/>
  <text x="156" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BOTTLENECK</text>
  <rect x="244" y="660" width="20" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="272" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ARTIFACT · VERSION</text>
  <rect x="400" y="660" width="20" height="12" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="428" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FAILING ROUTE</text>
  <line x1="540" y1="666" x2="568" y2="666" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="576" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CROSSES A ZONE</text>
  <line x1="700" y1="666" x2="728" y2="666" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="736" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INSIDE A ZONE</text>
  <line x1="856" y1="666" x2="884" y2="666" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
  <text x="892" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FALLBACK</text>
</svg>
