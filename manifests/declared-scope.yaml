# Declared-scope source manifest; field reference in docs/MAINTAINING.md. Tier 1 = the declared scope;
# tier 2 = other cantons and cities; tier 3 = bulk or gazette collections (opt-in). `corpus fetch --tier N`
# crawls tiers 1..N. The Run 3 entries at the end come from docs/sources/verification_2026-09-23/run3/ on
# branch sources/run3-discovery (corpus_pipeline/manifest_candidates.yaml).
# A `# CAVEAT (...)` comment above an entry flags a known issue (personal data, volume) that was accepted.
# `connector: json` entries read records from a JSON/REST API; their config keys are documented in
# src/swiss_grounding/corpus/connectors/json_api.py.
# Optional per-site keys: language_links_selector, content_selector, pdf_link_patterns,
# sitemap_urls/sitemap_include. Start URLs verified live on 2026-09-23 with the corpus user agent.
version: 1
sources:
  # ---------------- Federal: law ----------------
  - id: fedlex
    name: Fedlex — Systematic Compilation of Federal Law
    publisher: Swiss Federal Chancellery
    authority: federal_law
    level: federal
    extent_id: CH
    connector: fedlex
    tier: 1
    languages: [de, fr, it, en]
    config:
      sr_numbers: ["101", "141.0", "142.20", "142.201", "161.1", "210", "220", "221.213.11", "281.1", "311.0",
                   "455", "631.0", "641.20", "642.11", "704", "741.01", "741.11", "741.51", "784.40", "814.01",
                   "814.600", "822.11", "831.10", "831.40", "832.10", "832.102", "837.0", "451",
                   # from the registry (Lundrim, 2026-09-22): weapons, civil protection, spatial planning,
                   # waste ordinance, epidemics, animal health, forests, hunting
                   "514.54", "520.1", "700", "814.610", "818.101", "916.40", "921.0", "922.0",
                   # commercial register ordinance (topic 14: companies, commercial register, VAT)
                   "221.411"]

