[project]
name = "swiss-grounding"
version = "0.1.0"
description = "Swiss Grounding MCP: jurisdiction-aware retrieval over Swiss public sources"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "lxml>=5.0",
    "pypdf>=4.0",
    "anthropic>=0.40",
    "openai>=1.60",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "protego>=0.3",
]

[project.optional-dependencies]
embed = [
    "flagembedding>=1.3",
    "sentence-transformers>=3.0",
]
eval = [
    "scikit-learn>=1.5",
]

[project.scripts]
swiss-grounding = "swiss_grounding.cli.main:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_grounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs DATABASE_URL and a running PostgreSQL"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
