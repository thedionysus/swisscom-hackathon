services:
  db:
    # Pinned to the pgvector extension version the prebuilt dump was made with (ADR 0017):
    # a restore must never meet a different extension version.
    image: pgvector/pgvector:0.8.6-pg16
    # Parallel HNSW index builds share memory through /dev/shm; Docker's 64 MB default is too small.
    shm_size: "2gb"
    environment:
      POSTGRES_USER: swiss
      POSTGRES_PASSWORD: swiss
      POSTGRES_DB: swiss_grounding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiss -d swiss_grounding"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
