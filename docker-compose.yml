services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: swiss
      POSTGRES_PASSWORD: swiss
      POSTGRES_DB: swiss_grounding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiss -d swiss_grounding"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
