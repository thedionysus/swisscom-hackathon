<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rules change, and we keep the history · Swiss Grounding</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #d52b1e;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.75rem; }
    .lede { max-width: 68ch; color: var(--color-muted); line-height: 1.5; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    footer { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--color-rule);
             font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-soft); line-height: 1.7; }
    footer code { font-family: var(--font-mono); color: var(--color-muted); }
    table { margin-top: 1.5rem; border-collapse: collapse; font-size: 0.8rem; min-width: 60%; }
    caption { text-align: left; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.14em;
              text-transform: uppercase; color: var(--color-soft); padding-bottom: 0.5rem; }
    th, td { text-align: left; padding: 0.35rem 1rem 0.35rem 0; border-bottom: 1px solid var(--color-rule); }
    th { font-weight: 600; }
    td:nth-child(n+3), th:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Swiss Grounding · jury deck · slide 07</p>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rules-change-title rules-change-desc">
<title id="rules-change-title">Rules change, and we keep the history</title>
<desc id="rules-change-desc">A timeline of one document&#x27;s versions: an older version, replaced but kept; the current version that answers cite today; and the next version of a law, stored before its start date. On 25 September 2026 the corpus held 268 older versions, 16,769 current documents and 33 law versions waiting for their start date. A past date can be asked for; a page that disappears is marked withdrawn.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d52b1e"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- arrows -->
<path d="M 40,336 L 1232,336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- labels -->
<!-- nodes -->
<rect x="40" y="216" width="344" height="80" rx="6" fill="#f5f5f5"/>
<rect x="40" y="216" width="344" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="212" y="252.4" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Older version</text>
<text x="212" y="270" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">replaced, but kept</text>
<rect x="424" y="216" width="392" height="80" rx="6" fill="#f5f5f5"/>
<rect x="424" y="216" width="392" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="620" y="252.4" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Current version</text>
<text x="620" y="270" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">what answers cite today</text>
<rect x="856" y="216" width="384" height="80" rx="6" fill="#f5f5f5"/>
<rect x="856" y="216" width="384" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="1048" y="252.4" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next version of a law</text>
<text x="1048" y="270" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">stored before its start date</text>
<!-- annotations -->
<text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">SWISS GROUNDING · VERSIONS</text>
<text x="40" y="100" fill="#2d3142" font-size="40" font-family="'Instrument Serif', 'Noto Serif', serif">Rules change, and we keep the history</text>
<text x="40" y="132" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">Old versions are kept, new laws wait for their start date, and you can ask about a past date.</text>
<text x="1240" y="364" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.1em">TIME</text>
<line x1="404" y1="328" x2="404" y2="344" stroke="#4f5d75" stroke-width="1.6"/>
<text x="404" y="364" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">A CHANGE</text>
<line x1="836" y1="328" x2="836" y2="344" stroke="#4f5d75" stroke-width="1.6"/>
<text x="836" y="364" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">START DATE</text>
<circle cx="212" cy="336" r="5" fill="#2d3142" stroke="#f5f5f5" stroke-width="2"/>
<text x="212" y="364" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">A PAST DATE</text>
<line x1="620" y1="304" x2="620" y2="330" stroke="#d52b1e" stroke-width="1.6"/>
<circle cx="620" cy="336" r="6" fill="#d52b1e" stroke="#f5f5f5" stroke-width="2"/>
<text x="620" y="364" fill="#d52b1e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">TODAY</text>
<text x="40" y="436" fill="#2d3142" font-size="40" font-family="'Instrument Serif', 'Noto Serif', serif">268</text>
<text x="40" y="460" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">older versions, never deleted</text>
<text x="40" y="512" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">Ask for a past date, and the law</text>
<text x="40" y="534" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">in force on that day answers.</text>
<text x="424" y="436" fill="#2d3142" font-size="40" font-family="'Instrument Serif', 'Noto Serif', serif">16,769</text>
<text x="424" y="460" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">current documents</text>
<text x="424" y="512" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">A page that disappears is marked</text>
<text x="424" y="534" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">withdrawn: kept, but never cited.</text>
<text x="856" y="436" fill="#2d3142" font-size="40" font-family="'Instrument Serif', 'Noto Serif', serif">33</text>
<text x="856" y="460" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">law versions waiting for their start date</text>
<text x="856" y="512" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">It switches on at the first refresh</text>
<text x="856" y="534" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif">on or after its start date.</text>
<text x="856" y="572" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">e.g. the Code of Obligations, from 1 October 2026</text>
<text x="40" y="648" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">Counted in the corpus on 25 September 2026.</text>
</svg>
