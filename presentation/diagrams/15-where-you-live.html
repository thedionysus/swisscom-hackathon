  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;

         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.75rem; }
    .lede { max-width: 68ch; color: var(--color-muted); line-height: 1.5; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    footer { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--color-rule);
             font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-soft); line-height: 1.7; }
    footer code { font-family: var(--font-mono); color: var(--color-muted); }
    table { margin-top: 1.5rem; border-collapse: collapse; font-size: 0.8rem; min-width: 60%; }
    caption { text-align: left; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.14em;
              text-transform: uppercase; color: var(--color-soft); padding-bottom: 0.5rem; }
    th, td { text-align: left; padding: 0.35rem 1rem 0.35rem 0; border-bottom: 1px solid var(--color-rule); }
    th { font-weight: 600; }
    td:nth-child(n+3), th:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }

<title id="where-you-live-title">Does the answer depend on where you live?</title>
<desc id="where-you-live-desc">The cardboard-collection question arrives with no place: the server searches all of Switzerland, finds that only town pages answer, from Chur to Fribourg, and no federal page settles it, so it asks for the municipality; when a federal page answers for everyone it answers directly. Subjects that communes or cantons set are listed.</desc>

<text x="56" y="288.5" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" text-anchor="start">Wann wird bei uns das</text>

<text x="56" y="332.5" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" text-anchor="start">abgeholt?</text>

<text x="464" y="322" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">city pages alike</text>
<polygon points="760,220 872,300 760,380 648,300" fill="#f5f5f5"/>
<polygon points="760,220 872,300 760,380 648,300" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="760" y="288.4" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Federal page</text>

<text x="760" y="322" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">everyone?</text>

<text x="760" y="468.4" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Answer directly</text>

<text x="760" y="502" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">the same for everyone</text>

<rect x="928" y="432" width="312" height="160" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="944" y="458.4" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Set by the commune or canton</text>

<text x="944" y="524" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">municipal tax rate</text>
<text x="944" y="540" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start"></text>
<text x="944" y="556" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">Nor when the federal page itself</text>
<text x="944" y="572" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">says the canton or commune decides.</text>
<!-- annotations -->
<text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">SWISS GROUNDING · WHERE YOU LIVE</text>
<text x="40" y="100" fill="#2d3142" font-size="40" font-family="'Instrument Serif', 'Noto Serif', serif">Does the answer depend on where you live?</text>
<text x="40" y="132" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">With no place given, it searches all of Switzerland, and asks back when only local pages answer.</text>
<text x="40" y="464" fill="#4f5d75" font-size="16" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Name the place, and it searches</text>
<text x="40" y="484" fill="#4f5d75" font-size="16" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">that commune, then its canton,</text>
<text x="40" y="504" fill="#4f5d75" font-size="16" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">then all of Switzerland.</text>
<text x="40" y="648" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">Challenge question 1, asked without a place on 25 September 2026 against the Run 3 corpus.</text>
