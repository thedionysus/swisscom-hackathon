  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-accent: #d52b1e;
      --color-rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.75rem; }
    .lede { max-width: 68ch; color: var(--color-muted); line-height: 1.5; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
    footer { margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--color-rule);
             font-family: var(--font-mono); font-size: 0.7rem; color: var(--color-soft); line-height: 1.7; }
    footer code { font-family: var(--font-mono); color: var(--color-muted); }
    table { margin-top: 1.5rem; border-collapse: collapse; font-size: 0.8rem; min-width: 60%; }
    caption { text-align: left; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.14em;
              text-transform: uppercase; color: var(--color-soft); padding-bottom: 0.5rem; }
    th, td { text-align: left; padding: 0.35rem 1rem 0.35rem 0; border-bottom: 1px solid var(--color-rule); }
    th { font-weight: 600; }
    td:nth-child(n+3), th:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>

<desc id="place-tree-desc">The place tree: Switzerland, its 26 cantons, 2,110 communes and the 12 districts of the city of Zürich. The path from Lausanne through Vaud to Switzerland is highlighted: a Lausanne question searches all three. A Winterthur question searches the canton of Zurich and Switzerland and says the city&#x27;s own rules are not covered. Wil is two communes, in Zurich and in St. Gallen, so the server asks which one.</desc>

<text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.18em">SWISS GROUNDING · PLACES</text>
<text x="40" y="100" fill="#2d3142" font-size="40" font-family="'Instrument Serif', 'Noto Serif', serif">Switzerland as a tree</text>
<text x="40" y="132" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">Every passage belongs to one place. A question searches its place and every level above it.</text>
<text x="40" y="210" fill="#2d3142" font-size="32" font-family="'Instrument Serif', 'Noto Serif', serif">1</text>

<text x="40" y="314" fill="#2d3142" font-size="32" font-family="'Instrument Serif', 'Noto Serif', serif">26</text>
<text x="40" y="334" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">cantons</text>
<text x="40" y="418" fill="#2d3142" font-size="32" font-family="'Instrument Serif', 'Noto Serif', serif">2,110</text>
<text x="40" y="438" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">communes</text>
<text x="40" y="522" fill="#2d3142" font-size="32" font-family="'Instrument Serif', 'Noto Serif', serif">12</text>
<text x="40" y="542" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">districts (city of Zürich)</text>
<text x="1016" y="318" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">and 24 more</text>
<text x="1136" y="422" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">and 2,107 more</text>
<text x="320" y="480" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">A Lausanne question searches</text>
<text x="320" y="498" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Lausanne, Vaud and Switzerland.</text>
<text x="920" y="480" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">A Winterthur question searches Zurich</text>
<text x="920" y="498" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">and Switzerland, and says the city&#x27;s</text>
<text x="920" y="516" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">own rules are not covered.</text>
<text x="888" y="196" fill="#4f5d75" font-size="16" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">“Wil” is two communes, Wil ZH</text>
<text x="888" y="216" fill="#4f5d75" font-size="16" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">and Wil SG: the server asks</text>
<text x="888" y="236" fill="#4f5d75" font-size="16" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">which one.</text>
<text x="40" y="648" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">Counted in the corpus on 25 September 2026.</text>
